services:
  renderer:
    build:
      context: ../..
      dockerfile: infra/vps-renderer/Dockerfile
    env_file: ../../.env
    environment:
      - NODE_ENV=production
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
